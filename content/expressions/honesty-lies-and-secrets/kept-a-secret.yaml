slug: kept-a-secret
text: kept a secret
kind: phrase
simpleMeaning: Did not tell anyone something that was meant to stay private.
contextualMeaning: Keeping a secret can be a sign of loyalty or of guilt. The same action means different things in different stories.
usageNotes: "Use it for promises and hidden things: she kept the secret for years. The opposite is let it slip, or told."
register: neutral
level: beginner
status: draft
categories:
  - keeping-secrets
tags:
  - technique:characterisation
  - technique:suspense
searchPhrases:
  - did not tell anyone
  - kept something hidden
  - stayed silent about it
examples:
  - text: She kept a secret from her sister for years.
    setting: everyday
  - text: He kept a secret that grew heavier every day.
    setting: narration
  - text: “I kept a secret for you once,” he said. “Now it is your turn.”
    setting: dialogue
relations:
  - to: let-it-slip
    type: antonym
  - to: came-clean
    type: antonym
mistakes:
  - wrong: She kept secret.
    right: She kept a secret.
    explanation: "Secret is a noun here, so it needs a: keep a secret."
