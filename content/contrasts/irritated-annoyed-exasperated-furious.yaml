slug: irritated-annoyed-exasperated-furious
title: Irritated, annoyed, exasperated, furious
explanation: These four are steps on a scale of anger. Irritated and annoyed are small; exasperated is anger with no patience left; furious is anger at full strength.
members:
  - expression: irritated
    note: A small, repeated bother. Controlled and often shown by tiny signs.
    example: He tapped the table, irritated by the slow waiter.
  - expression: annoyed
    note: Everyday displeasure, similar to irritated but more spoken and general.
    example: “I’m annoyed, Sam. You promised to call.”
  - expression: exasperated
    note: Patience has run out after repeated trouble.
    example: “For the last time, put your shoes away!” she said, exasperated.
  - expression: furious
    note: Extreme anger. The feeling is strong and the cause serious.
    example: He was furious when he discovered the money was gone.
