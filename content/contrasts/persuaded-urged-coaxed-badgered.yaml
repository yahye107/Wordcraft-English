slug: persuaded-urged-coaxed-badgered
title: Persuaded, urged, coaxed, badgered
explanation: Four ways to get someone to act. Persuaded means you succeeded with reasons; urged means you pressed strongly; coaxed means you were gentle and patient; badgered means you kept pressing until they were annoyed.
members:
  - expression: persuaded
    note: You gave reasons and the person agreed.
    example: I persuaded her to see a doctor.
  - expression: urged
    note: You pressed strongly. The person may not agree.
    example: He urged her to see a doctor.
  - expression: coaxed
    note: You were gentle and patient with someone hesitant.
    example: He coaxed her into seeing a doctor.
  - expression: badgered
    note: You kept asking until they were annoyed or gave in.
    example: They badgered her until she saw a doctor.
