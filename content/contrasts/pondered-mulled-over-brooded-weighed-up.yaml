slug: pondered-mulled-over-brooded-weighed-up
title: Pondered, mulled over, brooded, weighed up
explanation: Four ways of thinking. Pondered is slow and serious; mulled over is a relaxed turning-over; brooded is unhappy and repeating; weighed up compares good and bad points.
members:
  - expression: pondered
    note: Slow, serious thinking about a big question.
    example: He pondered what to say at her funeral.
  - expression: mulled-over
    note: Relaxed, practical turning over of an idea.
    example: I’ll mull it over and call you tomorrow.
  - expression: brooded
    note: Unhappy or angry thoughts that keep returning.
    example: She brooded over his harsh words all night.
  - expression: weighed-up
    note: Comparing advantages and disadvantages.
    example: They weighed up the cost against the benefit.
