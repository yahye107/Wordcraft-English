slug: strolled-strode-trudged-sauntered
title: Strolled, strode, trudged, sauntered
explanation: Four verbs for walking show attitude. Strolled is relaxed, strode is confident and fast, trudged is heavy and tired, and sauntered is slow with cool attitude.
members:
  - expression: strolled
    note: Slow, pleasant and relaxed.
    example: They strolled through the market.
  - expression: strode
    note: Long, firm, purposeful steps.
    example: She strode up to the desk and demanded to see the manager.
  - expression: trudged
    note: Slow, heavy steps from tiredness or difficult ground.
    example: He trudged through the snow with a heavy bag.
  - expression: sauntered
    note: Slow and relaxed with a confident or careless attitude.
    example: He sauntered in late, hands in his pockets.
