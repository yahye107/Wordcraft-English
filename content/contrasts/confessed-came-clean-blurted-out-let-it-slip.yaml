slug: confessed-came-clean-blurted-out-let-it-slip
title: Confessed, came clean, blurted out, let it slip
explanation: Four ways the truth comes out. Confessed and came clean are on purpose, and confessing is the heavier word. Blurted out is sudden and unplanned. Let it slip is a pure accident.
members:
  - expression: confessed
    note: "On purpose and serious: admitting a wrong."
    example: He confessed that he had cheated on the test.
  - expression: came-clean
    note: "On purpose and a relief: telling what you hid."
    example: She came clean about the lost ring.
  - expression: blurted-out
    note: Sudden, without thinking.
    example: He blurted out the answer before the teacher finished.
  - expression: let-it-slip
    note: "An accident: you did not mean to say it."
    example: She let it slip that the party was a surprise.
