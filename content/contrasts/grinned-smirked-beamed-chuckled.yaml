slug: grinned-smirked-beamed-chuckled
title: Grinned, smirked, beamed, chuckled
explanation: Four ways to show amusement or pleasure. A grin is wide and cheerful, a smirk is smug, a beam glows with joy or pride, and a chuckle is a soft laugh.
members:
  - expression: grinned
    note: Wide, open and cheerful. Teeth often show.
    example: Zane grinned and pulled out two tickets.
  - expression: smirked
    note: Smug or mocking. The smile has an edge.
    example: She smirked as the manager read the mistake aloud.
  - expression: beamed
    note: Joy or pride lights the whole face.
    example: The grandmother beamed at the baby.
  - expression: chuckled
    note: A low, quiet laugh of mild amusement.
    example: “Well, that’s true,” he chuckled.
