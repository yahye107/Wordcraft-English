slug: however-nevertheless-even-so
title: However, nevertheless, even so
explanation: Three ways to say "despite that". However is the plain contrast word, nevertheless adds a firmer formal concession, and even so is the lighter, more spoken version.
members:
  - expression: however
    note: A neutral turn to a contrasting point. Watch the punctuation.
    example: It was cheap. However, it broke on the first day.
  - expression: nevertheless
    note: "Formal and firm: the first point is true, but the second stands anyway."
    example: The test was hard. Nevertheless, most students passed.
  - expression: even-so
    note: Lighter and more natural, good in speech and easy essays.
    example: It was cold. Even so, we swam.
