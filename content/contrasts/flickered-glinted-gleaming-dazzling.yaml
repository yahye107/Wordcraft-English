slug: flickered-glinted-gleaming-dazzling
title: Flickered, glinted, gleaming, dazzling
explanation: "Four words for light. They differ in strength and steadiness: flickered is weak and unsteady, glinted is a quick flash, gleaming is a smooth steady shine, and dazzling is too bright to look at."
members:
  - expression: flickered
    note: Weak, unsteady light that comes and goes.
    example: The candle flickered in the draught.
  - expression: glinted
    note: A tiny, sharp flash.
    example: The coin glinted at the bottom of the fountain.
  - expression: gleaming
    note: A smooth, steady shine from a clean surface.
    example: The gleaming car stood outside the hotel.
  - expression: dazzling
    note: So bright that it hurts to look.
    example: The dazzling headlights blinded him for a second.
