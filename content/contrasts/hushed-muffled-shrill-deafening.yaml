slug: hushed-muffled-shrill-deafening
title: Hushed, muffled, shrill, deafening
explanation: Four words for how a sound reaches the ear. Hushed is quiet on purpose, muffled is dull because something covers it, shrill is high and sharp, and deafening is so loud that nothing else can be heard.
members:
  - expression: hushed
    note: Quiet because people choose to be.
    example: They spoke in hushed voices outside the sleeping child’s room.
  - expression: muffled
    note: Dull and unclear because something is in the way.
    example: Her muffled shout came from inside the wardrobe.
  - expression: shrill
    note: High, sharp and unpleasant.
    example: A shrill scream rang through the house.
  - expression: deafening
    note: Loud enough to drown everything else.
    example: The deafening roar of the crowd shook the stands.
