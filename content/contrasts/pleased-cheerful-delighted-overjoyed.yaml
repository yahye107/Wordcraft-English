slug: pleased-cheerful-delighted-overjoyed
title: Pleased, cheerful, delighted, overjoyed
explanation: Four words for being happy, from mild to extreme. Pleased is polite and calm, cheerful is a bright mood in general, delighted is strong happiness about something, and overjoyed is happiness that spills over.
members:
  - expression: pleased
    note: Mild, polite happiness about a result.
    example: She was pleased with her test score.
  - expression: cheerful
    note: A bright, friendly mood that is not about one event.
    example: The cheerful waiter greeted everyone by name.
  - expression: delighted
    note: Strong, open happiness about something.
    example: He was delighted by the surprise party.
  - expression: overjoyed
    note: Extreme happiness. It is almost too much to hold.
    example: They were overjoyed when the baby was born.
