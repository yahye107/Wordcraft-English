slug: self-assured-cocky-arrogant
title: Self-assured, cocky, arrogant
explanation: Three levels of confidence. Self-assured is calm and admired, cocky shows off, and arrogant looks down on others.
members:
  - expression: self-assured
    note: Calm confidence. No need to show off.
    example: She gave a self-assured answer and sat down.
  - expression: cocky
    note: Over-confidence that shows off and expects to win.
    example: The cocky player waved to the crowd before the game began.
  - expression: arrogant
    note: Believing you are better than others, and showing it.
    example: The arrogant manager ignored everyone’s advice.
