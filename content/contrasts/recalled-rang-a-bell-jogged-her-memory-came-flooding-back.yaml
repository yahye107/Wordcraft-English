slug: recalled-rang-a-bell-jogged-her-memory-came-flooding-back
title: Recalled, rang a bell, jogged her memory, came flooding back
explanation: Four ways a memory returns. Rang a bell is only a feeling of familiarity, jogged her memory is a small clue that helps, came flooding back is a rush of everything at once, and recalled is calling it to mind on purpose.
members:
  - expression: rang-a-bell
    note: A faint feeling that you know it.
    example: The name rang a bell, but he could not say why.
  - expression: jogged-her-memory
    note: A small clue that gives memory a push.
    example: The photo jogged his memory of the trip.
  - expression: came-flooding-back
    note: Everything returns at once.
    example: When she heard the song, the whole summer came flooding back.
  - expression: recalled
    note: You call it to mind on purpose.
    example: He recalled every detail of the meeting.
