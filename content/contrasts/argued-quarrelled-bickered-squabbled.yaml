slug: argued-quarrelled-bickered-squabbled
title: Argued, quarrelled, bickered, squabbled
explanation: Four verbs for conflict in words. Argued is the general word; quarrelled is an angry, serious fight; bickered is repeated small irritation; squabbled is noisy, petty fighting.
members:
  - expression: argued
    note: General disagreement, often with reasons and raised voices.
    example: They argued about where to live.
  - expression: quarrelled
    note: A serious, angry fight, usually with someone close.
    example: The sisters quarrelled and did not speak for a year.
  - expression: bickered
    note: Small, repeated, irritated arguing.
    example: The couple bickered about the route the whole way.
  - expression: squabbled
    note: Noisy, petty fighting over something unimportant.
    example: The children squabbled over the last biscuit.
