slug: sobbed-wept-whimpered-sniffled
title: Sobbed, wept, whimpered, sniffled
explanation: "Four words for crying. They differ in volume and force: sobbed is loud and shaking, wept is quiet and serious, whimpered is soft and frightened, and sniffled is tiny and mostly in the nose."
members:
  - expression: sobbed
    note: Loud, shaking crying.
    example: He sobbed on his mother’s shoulder.
  - expression: wept
    note: Quiet, serious crying. It is a fuller word than cried.
    example: The widow wept at the graveside.
  - expression: whimpered
    note: Soft, weak sounds of fear or pain.
    example: The child whimpered in the dark.
  - expression: sniffled
    note: Small, noisy breaths. It is the lightest of the four.
    example: She sniffled into a tissue and smiled.
