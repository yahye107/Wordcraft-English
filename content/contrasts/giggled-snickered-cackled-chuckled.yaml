slug: giggled-snickered-cackled-chuckled
title: Giggled, snickered, cackled, chuckled
explanation: Four kinds of laughter. Giggled is light and high, chuckled is low and warm, snickered is quiet and unkind, and cackled is loud and harsh.
members:
  - expression: giggled
    note: Light, high and playful, often nervous.
    example: The twins giggled when the dog sneezed.
  - expression: chuckled
    note: Low, warm and private, a quiet laugh.
    example: Grandpa chuckled at the old photo.
  - expression: snickered
    note: Quiet and unkind, behind a hand.
    example: Two boys snickered when she dropped her tray.
  - expression: cackled
    note: Loud, harsh and wild.
    example: The witch cackled over her pot.
