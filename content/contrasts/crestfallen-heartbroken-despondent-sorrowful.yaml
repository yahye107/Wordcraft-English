slug: crestfallen-heartbroken-despondent-sorrowful
title: Crestfallen, heartbroken, despondent, sorrowful
explanation: "All four are sad, but the cause and the length differ: crestfallen is a visible letdown, heartbroken is deep personal loss, despondent is hopelessness over time, and sorrowful describes sadness as it is shown."
members:
  - expression: crestfallen
    note: A sudden drop after a hope fails. It shows on the face.
    example: He was crestfallen when his name was not on the list.
  - expression: heartbroken
    note: Deep pain, usually from love or a serious loss.
    example: She was heartbroken when the engagement ended.
  - expression: despondent
    note: Long, low sadness with no hope or energy.
    example: After the third rejection he became despondent.
  - expression: sorrowful
    note: Solemn sadness that is visible in a look, voice or song.
    example: He gave a sorrowful nod and left.
