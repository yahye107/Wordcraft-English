slug: snapped-protested-exclaimed-remarked
title: Snapped, protested, exclaimed, remarked
explanation: "Four common dialogue tags that tell the reader what the speech is doing: snapped shows sharp anger, protested objects, exclaimed bursts with feeling, and remarked comments calmly."
members:
  - expression: snapped
    note: Short, sharp words from a speaker who has lost patience.
    example: “Not now,” she snapped.
  - expression: protested
    note: The speaker objects, thinking something is wrong or unfair.
    example: “But I was first!” he protested.
  - expression: exclaimed
    note: Words burst out of surprise or joy.
    example: “You came!” she exclaimed.
  - expression: remarked
    note: A calm, often dry comment about something observed.
    example: “It’s a little cold,” he remarked.
