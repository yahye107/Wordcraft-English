slug: limped-shuffled-tiptoed-trudged
title: Limped, shuffled, tiptoed, trudged
explanation: Four ways of walking that are not smooth. Limped is uneven because of pain, shuffled drags the feet, tiptoed is quiet on purpose, and trudged is slow and heavy with effort.
members:
  - expression: limped
    note: Uneven steps because something hurts.
    example: The goalkeeper limped off the pitch.
  - expression: shuffled
    note: Small steps with the feet dragging.
    example: The prisoners shuffled across the yard.
  - expression: tiptoed
    note: Quiet steps on the front of the feet.
    example: The children tiptoed down the stairs.
  - expression: trudged
    note: Slow, heavy steps, as if through mud.
    example: They trudged home through the snow.
