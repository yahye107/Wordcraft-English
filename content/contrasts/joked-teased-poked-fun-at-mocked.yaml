slug: joked-teased-poked-fun-at-mocked
title: Joked, teased, poked fun at, mocked
explanation: Four words for humour about a person, from kind to cruel. Joked is shared fun, teased is friendly fun at someone’s expense, poked fun at is lighter but a little unkind, and mocked is cruel.
members:
  - expression: joked
    note: Shared, friendly humour. Everyone is in on it.
    example: We joked about the burnt toast.
  - expression: teased
    note: Friendly fun at someone’s expense, between people who like each other.
    example: Dad teased me about my terrible dancing.
  - expression: poked-fun-at
    note: "Lighter than mocking but unkind: the person may not enjoy it."
    example: The class poked fun at the new boy’s hat.
  - expression: mocked
    note: Cruel. The person is hurt on purpose.
    example: They mocked her for crying.
