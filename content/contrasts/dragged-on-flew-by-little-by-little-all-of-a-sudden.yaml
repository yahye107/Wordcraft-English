slug: dragged-on-flew-by-little-by-little-all-of-a-sudden
title: Dragged on, flew by, little by little, all of a sudden
explanation: Four phrases for how time or change moves. Dragged on is slow and boring, flew by is fast and usually enjoyable, little by little is slow and steady, and all of a sudden is fast and unexpected.
members:
  - expression: dragged-on
    note: Too slow and boring. The time feels wasted.
    example: The speech dragged on for an hour.
  - expression: flew-by
    note: Too fast to notice, often because you were happy.
    example: The holiday flew by.
  - expression: little-by-little
    note: Slow, steady change in small steps.
    example: Little by little, the garden filled with flowers.
  - expression: all-of-a-sudden
    note: Fast change with no warning.
    example: All of a sudden the music stopped.
