slug: glared-stared-gazed-glanced
title: Glared, stared, gazed, glanced
explanation: "Four verbs of looking. They differ in length and feeling: glanced is quick, stared is long, gazed is long and soft, and glared is long and angry."
members:
  - expression: glared
    note: A long, angry look.
    example: Mia glared at the man who cut in line.
  - expression: stared
    note: A long, fixed look. The feeling comes from the context.
    example: He stared at the empty chair.
  - expression: gazed
    note: A long, soft look full of wonder or longing.
    example: She gazed at the sea.
  - expression: glanced
    note: A very quick look.
    example: He glanced at his phone and put it away.
