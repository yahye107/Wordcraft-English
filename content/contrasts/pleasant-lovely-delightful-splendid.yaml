slug: pleasant-lovely-delightful-splendid
title: Pleasant, lovely, delightful, splendid
explanation: Four words of praise, from mild to grand. Pleasant is simply nice, lovely is warm and very common, delightful is charming and a little formal, and splendid is excellent and impressive.
members:
  - expression: pleasant
    note: Mild and agreeable.
    example: We spent a pleasant afternoon by the river.
  - expression: lovely
    note: Warm and friendly, very common.
    example: She wore a lovely blue dress.
  - expression: delightful
    note: Charming and joyful, a little formal.
    example: It was a delightful little café.
  - expression: splendid
    note: Excellent and impressive.
    example: The splendid ballroom was full of light.
