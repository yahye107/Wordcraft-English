slug: l7-5-cannot-say-it
lesson: hesitation-and-uncertainty
level: intermediate
prompt: Write a short exchange in which one character cannot say what they really mean. Use one dash, one ellipsis and one beat of hesitation.
explanation: Read the exchange aloud. Can you hear where the voice stops and where it fades?
type: free_write
checklist:
  - You used exactly one dash for a cut-off or stumble.
  - You used exactly one ellipsis for a fading voice.
  - One beat shows the hesitation (a glance, a cough, a pause).
  - The marks are not on every line.
sample: “Ana, I—” Marco looked at the floor. “It’s about the flat. I mean, if you’re still planning…” He turned his cup a quarter turn on the saucer. “Never mind.”
