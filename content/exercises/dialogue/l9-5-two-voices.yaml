slug: l9-5-two-voices
lesson: confidence-and-frustration
level: advanced
prompt: Write a short exchange between a confident manager and a frustrated worker who cannot finish a report. Show each voice mainly through rhythm, not tags.
explanation: Read only the speech. Can you tell which voice is which without the tags?
type: free_write
checklist:
  - The manager uses complete, firm sentences.
  - The worker’s lines are shorter, broken or repeated.
  - At most one tag in the whole exchange.
  - One beat shows the worker’s frustration.
sample: |-
  “We present at four.” Sana didn’t look up from her screen.

  “I know. It’s just—no. No, the numbers don’t match. Again.” Omar pushed back his chair.

  “Then fix the sheet.”
