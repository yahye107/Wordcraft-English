slug: l5-5-rewrite-the-told-lines
lesson: showing-emotion-in-dialogue
level: intermediate
prompt: "Rewrite these three told lines so the emotion is shown: (1) “I’m happy,” she said joyfully. (2) “Go away,” he said angrily. (3) “I’m worried,” she said nervously."
explanation: Look at each beat and ask whether you could film it.
type: free_write
checklist:
  - Each rewrite keeps the speech and adds one action beat.
  - No rewrite uses the adverb (joyfully, angrily, nervously).
  - Each beat is a sentence of its own with a capital letter.
  - Each beat is something a reader could picture.
sample: “I’m happy.” She spun in a circle in the hallway. “Go away.” He pushed the door shut with his shoulder. “I’m worried.” She twisted the end of her scarf round her finger.
