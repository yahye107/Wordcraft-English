slug: l10-5-bad-news
lesson: inner-thoughts-and-reactions
level: advanced
prompt: Write a short moment in which a character hears bad news. Include one reaction beat and one direct thought.
explanation: Ask whether the thought tells the reader something new or only repeats the beat.
type: free_write
checklist:
  - The news is in speech inside quotation marks.
  - A reaction beat comes first, in its own sentence.
  - The direct thought has no quotation marks and is tagged.
  - The thought adds something the beat does not show.
sample: “The flight is cancelled.” Mira’s fingers closed around the strap of her bag. Tomorrow, she thought. Not in time.
