slug: l8-5-write-a-sarcastic-line
lesson: sarcasm-and-subtext
level: advanced
prompt: Write a short exchange in which one character says something sarcastic. Give the reader one clue only (a scene detail, a beat or a tag).
explanation: Ask a friend, or yourself the next day, whether the tone is clear without any explanation.
type: free_write
checklist:
  - The words say the opposite of what the speaker means.
  - You gave exactly one clue to the tone.
  - The other character’s reply is natural and shows they understood.
  - You did not explain the sarcasm in the narration.
sample: “Lovely queue,” Hana said, looking at the line that wound out of the door. “Fantastic,” her brother agreed. “We’ll be home by Tuesday.”
