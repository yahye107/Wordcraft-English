slug: l12-4-write-your-scene
lesson: a-short-scene
level: advanced
prompt: Write a scene of eight to twelve lines between two people, one of whom has done something wrong. Use at least one beat before speech, one beat after speech, one stretch with no tags, one line of hesitation or sarcasm, and one thought.
explanation: Check your scene against the notes under “What each choice does”.
type: free_write
checklist:
  - The first speaker is clear from the first line.
  - At least one stretch of lines has no tags at all.
  - Every beat is its own sentence with a capital letter.
  - One line shows hesitation or sarcasm through a clue, not an adverb.
  - The thought has no quotation marks and adds something new.
  - Each speaker has their own paragraph.
sample: |-
  Idris held the car keys behind his back. “About the car.”

  “What about it?” Hana kept her eyes on the dishes.

  “It’s, well… it has a small dent.”

  “How small?”

  “Small. Door-shaped.”

  “Wonderful.” She dried her hands very slowly. “Just what I wanted for my birthday.” Don’t smile, she told herself. “Show me.”
