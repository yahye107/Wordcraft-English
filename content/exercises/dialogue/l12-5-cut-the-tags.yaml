slug: l12-5-cut-the-tags
lesson: a-short-scene
level: advanced
prompt: Take your scene from the last exercise and rewrite it without any tags at all. Use only beats and clear turns.
explanation: If any line is unclear, add a beat for the speaker, not a tag.
type: free_write
checklist:
  - No line uses a speech verb such as said or asked.
  - Each speaker still sounds different.
  - It is clear who speaks each line.
  - The first speaker is named by a beat.
sample: |-
  Idris held the car keys behind his back. “About the car.”

  “What about it?” Hana kept her eyes on the dishes.

  “It has a small dent.”

  “How small?”

  “Door-shaped.”

  Hana dried her hands very slowly. “Wonderful. Show me.”
