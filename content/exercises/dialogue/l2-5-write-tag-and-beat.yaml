slug: l2-5-write-tag-and-beat
lesson: tags-and-action-beats
level: beginner
prompt: Write three lines of dialogue about someone opening a surprise gift. Use one line with a tag, one with a beat and one with speech only.
explanation: Read your three lines aloud. Can you hear which one is the tag, which the beat and which the plain speech?
type: free_write
checklist:
  - One line uses a tag in lower case after a comma.
  - One line uses a beat in its own sentence with a capital letter.
  - You did not use a non-speech verb, such as smiled, as a tag.
  - All speech is inside quotation marks.
sample: “It’s too heavy to be socks,” Lila said. “Open it.” Her brother tore at the paper. “A telescope!”
