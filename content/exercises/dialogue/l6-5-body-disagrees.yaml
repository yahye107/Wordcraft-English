slug: l6-5-body-disagrees
lesson: faces-and-bodies-with-speech
level: intermediate
prompt: Write three lines in which the speaker’s body disagrees with their words (for example someone who says they are calm).
explanation: Cover the beats and read only the speech. Then add the beats back. The gap between them is the effect you want.
type: free_write
checklist:
  - Each line has speech and one beat.
  - In each, the beat contradicts the words.
  - No beat uses a stock gesture (nod, shrug, smile) more than once.
  - You did not name the real feeling, only showed it.
sample: “I’m perfectly calm.” Her fingers drummed the table. “It’s only a test.” He bit the end of his pen until it cracked. “I don’t mind waiting.” She checked the door for the fifth time.
