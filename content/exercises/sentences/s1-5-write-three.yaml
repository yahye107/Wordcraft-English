slug: s1-5-write-three
lesson: subordinate-clauses
level: beginner
prompt: Write three sentences about a rainy day. Use because in one, although in another and when in the third.
explanation: "Check each sentence: can the main clause stand alone, and does the other part need it?"
type: free_write
checklist:
  - Each sentence has a main clause and a subordinate clause.
  - When the subordinate clause comes first, a comma follows it.
  - You used because, although and when once each.
  - Each sentence makes sense on its own.
sample: We stayed home because the streets were flooded. Although the rain was heavy, the children played by the window. When it stopped, everyone ran outside.
