slug: s12-5-improve-this
lesson: improving-flow
level: advanced
prompt: "Improve this paragraph: “I woke up. I got dressed. I went to the station. The train was late. I waited.” Join ideas with linking words and subordinate clauses, vary the sentence length and cut any filler."
explanation: Read your version aloud and check that it flows from one idea to the next.
type: free_write
checklist:
  - At least two sentences are joined with a linking word or clause.
  - The sentence lengths vary.
  - No filler words remain.
  - The meaning of every original sentence is kept.
sample: I woke late, dressed quickly and hurried to the station. The train was delayed, so I waited on the cold platform. Nothing.
