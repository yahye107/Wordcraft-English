slug: s3-5-write-two
lesson: cause-and-effect
level: intermediate
prompt: "Describe one small accident (a spilled drink, a missed bus) in two ways: one sentence with because, and two sentences linked by as a result."
explanation: Check that the cause comes with because, and the result comes with as a result.
type: free_write
checklist:
  - The first version uses because and has one sentence.
  - The second version uses as a result with a comma after it.
  - The cause and effect are the same in both.
  - Each version reads naturally.
sample: The glass slipped because her hands were wet. Her hands were wet. As a result, the glass slipped from her fingers.
