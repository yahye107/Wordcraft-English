slug: s5-5-cross-a-street
lesson: describing-movement
level: intermediate
prompt: Describe someone crossing a busy street. Use one strong verb, one participial phrase and one telling detail.
explanation: Underline your verb, phrase and detail. Each should add something different.
type: free_write
checklist:
  - At least one strong verb that already says how the person moves.
  - One participial phrase (an -ing or -ed phrase) with a comma.
  - One small detail the reader can see or hear.
  - No adverb is needed to do the verb’s job.
sample: Mara threaded through the traffic, clutching her bag to her chest. A taxi’s horn bleated just behind her.
