slug: s9-5-write-suspense
lesson: creating-suspense
level: advanced
prompt: Write a four-sentence moment of suspense in which a character is alone at night and hears something. Use one withheld detail, one very short sentence and one longer sentence that ends on the key word.
explanation: Read your moment aloud. Where does your voice slow down, and is that where the tension is?
type: free_write
checklist:
  - One detail raises a question without answering it.
  - At least one sentence is only a few words long.
  - One longer sentence ends on the most important word.
  - Nothing is explained at the end.
sample: The tap had stopped dripping. Jo held her breath. She crossed the landing, one hand flat against the wall, until she reached the door that had been shut an hour ago and was now open.
