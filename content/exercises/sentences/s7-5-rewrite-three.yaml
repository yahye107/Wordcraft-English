slug: s7-5-rewrite-three
lesson: emotion-through-physical-reaction
level: intermediate
prompt: "Rewrite these three sentences so the feeling is shown through the body: (1) I was scared. (2) She was angry. (3) He was thrilled."
explanation: "Cover the original and ask: could someone guess the feeling from the rewrite alone?"
type: free_write
checklist:
  - Each rewrite replaces the feeling word with a body detail.
  - At least one uses a clause or a participial phrase.
  - No rewrite uses the words scared, angry or thrilled.
  - Each detail is something a reader could picture.
sample: My knees would not stop shaking as I climbed the stairs. Her jaw locked and she pushed the chair in with a snap. He was already running, grinning at nothing, the letter crushed in his fist.
