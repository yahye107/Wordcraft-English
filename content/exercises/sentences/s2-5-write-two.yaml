slug: s2-5-write-two
lesson: participial-phrases
level: intermediate
prompt: "Write two sentences about a person arriving at a station: one with an opening participial phrase and one with a closing one."
explanation: For each phrase, ask who is doing the action. It must be the subject of the main clause.
type: free_write
checklist:
  - One sentence opens with an -ing or -ed phrase followed by a comma.
  - One sentence ends with a participial phrase after a comma.
  - The phrase’s action belongs to the subject of the main clause.
  - Neither phrase is left as a sentence on its own.
sample: Dragging her suitcase behind her, Lena crossed the platform. She stopped at the board, scanning the list of delays.
