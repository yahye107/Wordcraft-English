slug: s11-5-write-a-turn
lesson: sentence-length-and-rhythm
level: advanced
prompt: Write a paragraph of four sentences about waiting for something. Use one short sentence, one long sentence and a change of length at the moment the waiting ends.
explanation: Read your paragraph aloud and listen for where the rhythm changes.
type: free_write
checklist:
  - At least one sentence is only a few words long.
  - At least one sentence is long and flowing.
  - The length changes at the moment the waiting ends.
  - Not all four sentences are the same length.
sample: The clock above the door ticked through the whole long afternoon, each minute dragging after the last, the corridor empty and the light slowly thinning. She waited. Then footsteps. The door opened.
