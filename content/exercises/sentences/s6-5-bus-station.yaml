slug: s6-5-bus-station
lesson: describing-environments
level: intermediate
prompt: Describe a bus station at dawn in four sentences. Use at least three different senses and move from a wide view to a close detail.
explanation: Underline each sense you used. If they are all sight, add a sound or a smell.
type: free_write
checklist:
  - The first sentence gives a wide view.
  - You used at least three different senses.
  - The last sentence is one close detail.
  - The details suit one mood (quiet, tired or hopeful).
sample: Grey light seeped over the empty bays. Coffee and diesel hung in the cold air. Somewhere a shutter rattled up. A single pigeon walked along the timetable, pecking at nothing.
