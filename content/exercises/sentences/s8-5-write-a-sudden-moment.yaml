slug: s8-5-write-a-sudden-moment
lesson: thoughts-and-realisations
level: advanced
prompt: Write a three-sentence moment in which a character suddenly understands something. Do not use the words realised, understood or knew.
explanation: Ask whether a reader could say what was discovered without your naming it.
type: free_write
checklist:
  - The moment uses short sentences.
  - The reader can work out the discovery from a concrete detail.
  - One small physical reaction follows.
  - None of the words realised, understood or knew appear.
sample: Ben looked at the receipt again. The date was the day of the party. His hands went cold on the counter.
