slug: s4-5-write-two
lesson: expressing-contrast
level: intermediate
prompt: "Write two sentences about a place that is not what you expected: one with although and one with however."
explanation: Check the punctuation around each linking word.
type: free_write
checklist:
  - One sentence uses although with a comma after its clause.
  - One uses however after a full stop or a semicolon, with a comma after it.
  - Each sentence really sets two ideas against each other.
  - Each sentence reads naturally.
sample: Although the hotel looked grand on the website, the rooms were cramped. The staff were kind; however, the lift never worked.
